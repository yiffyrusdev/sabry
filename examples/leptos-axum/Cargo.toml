[package]
name = "leptos-axum-sabry"
version = "0.1.0"
rust-version = "1.88"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
leptos.version = "^0.8"
leptos_axum.version = "^0.8"
leptos_axum.optional = true
leptos_meta.version = "^0.8"
leptos_router.version = "^0.8"
axum.version = "0.8"
axum.optional = true
console_error_panic_hook = "0.1"
tokio.version = "1"
tokio.features = ["rt-multi-thread"]
tokio.optional = true
tower.version = "0.5"
tower.optional = true
tower-http.version = "0.6"
tower-http.features = ["fs"]
tower-http.optional = true
wasm-bindgen = "=0.2.114"
thiserror = "^1"
tracing.version = "0.1"
tracing.optional = true
http = "^1"
# sabry with sass
sabry.path = "../../"
# our component library
leptos-components.version = "0.0.0"
leptos-components.path = "../leptos-components"

[build-dependencies]
# sabry for build with sass
sabry.path = "../../"
sabry.features = ["build"]
# lets depend on our styles
define-styles.version = "0.0.0"
define-styles.path = "../define-styles"

[features]
hydrate = ["leptos/hydrate"]
ssr = [
  "dep:axum",
  "dep:tokio",
  "dep:tower",
  "dep:tower-http",
  "dep:leptos_axum",
  "leptos/ssr",
  "leptos_meta/ssr",
  "leptos_router/ssr",
  "dep:tracing",
]

[package.metadata.sabry]
css.minify = true
# We'll use bundle for leptos
css.bundle = "target/.sabry/target/bundle.css"
css.prelude = ["styles/prelude.css"]
sass.prelude = ["styles/app.scss"]

[package.metadata.leptos]
# Sabry-specific quality of life config
style-file = "target/.sabry/target/bundle.css"

output-name = "leptos-axum"
site-root = "target/site"
site-pkg-dir = "pkg"
assets-dir = "public"
site-addr = "127.0.0.1:3000"
reload-port = 3001
browserquery = "defaults"
env = "DEV"
bin-features = ["ssr"]
bin-default-features = false
lib-features = ["hydrate"]
lib-default-features = false
