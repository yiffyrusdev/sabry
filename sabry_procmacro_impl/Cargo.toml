[package]
name = "sabry_procmacro_impl"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Sabry proc-macro internals reusable outside of proc-macro context"
repository.workspace = true
license.workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
## Workspace
sabry_intrnl.workspace = true
sabry_intrnl.features = ["config-manifest", "style-compiler"]
## Css
raffia.workspace = true
## Util
itertools.workspace = true
regex.workspace = true
## Codegen
thiserror.workspace = true
proc-macro2.workspace = true
proc-macro2.features = ["span-locations"]
quote.workspace = true
syn.workspace = true
syn.features = ["parsing"]

[features]
nightly = []
