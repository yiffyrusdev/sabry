[package]
name = "sabry_intrnl"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Sabry internal, yet still public library"
repository.workspace = true
license.workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
## Css
raffia.version = "^0.13"
sasso.workspace = true
sasso.optional = true
base64.workspace = true
## Codegen
thiserror.workspace = true
syn.workspace = true
## Manifets seri
serde.workspace = true
serde.optional = true
serde.features = ["derive"]
toml.workspace = true
toml.optional = true

[features]
config-manifest = ["dep:toml", "dep:serde"]
style-compiler = ["dep:sasso"]
