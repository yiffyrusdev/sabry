[workspace]
resolver = "3"
members = ["sabry", "sabry_procmacro", "sabry_procmacro_impl", "sabry_intrnl", "sabry_build"]
exclude = ["examples"]

[workspace.package]
version = "0.0.7"
edition = "2024"
rust-version = "1.89"
authors = ["Svyatoslav Pushkarev <yiffyrusdev@yandex.ru>"]
repository = "https://github.com/yiffyrusdev/sabry"
license = "MIT"
publish = true

[workspace.dependencies]
## Workspace
sabry.path = "sabry"
sabry.version = "0.0.7"
sabry_intrnl.path = "sabry_intrnl"
sabry_intrnl.version = "0.0.7"
sabry_procmacro.path = "sabry_procmacro"
sabry_procmacro.version = "0.0.7"
sabry_procmacro_impl.path = "sabry_procmacro_impl"
sabry_procmacro_impl.version = "0.0.7"
sabry_build.path = "sabry_build"
sabry_build.version = "0.0.7"
## CSS
lightningcss.version = "1.0.0-alpha.72"
lightningcss.default-features = false
sasso.version = "^0.21"
sasso.default-features = false
raffia.version = "^0.13"
## Marshall
serde.version = "^1"
toml.version = "^1"
base64.version = "^0.23"
regex.version = "^1"
## Util
itertools.version = "^0.15"
walkdir.version = "^2"
## Codegen
cfg-if.version = "^1"
thiserror.version = "^2"
proc-macro2.version = "^1"
quote.version = "^1"
syn.version = "^3"
## Testing
insta.version = "^1"
