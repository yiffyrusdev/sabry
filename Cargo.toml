[workspace]
resolver = "2"
members = [
    "sabry_procmacro",
    "sabry_procmacro_impl",
    "sabry_intrnl",
    "sabry_build",
]
exclude = ["examples"]

[workspace.dependencies]
## Workspace
sabry_intrnl = { path = "sabry_intrnl", version = "0.0.6-rc.1" }
sabry_procmacro = { path = "sabry_procmacro", version = "0.0.6-rc.1" }
sabry_procmacro_impl = { path = "sabry_procmacro_impl", version = "0.0.6-rc.1" }
sabry_build = { path = "sabry_build", version = "0.0.6-rc.1" }
#/
lightningcss.version = "1.0.0-alpha.67"
lightningcss.default-features = false
grass.version = "^0.13"
grass.default-features = false
raffia.version = "^0.11"
#/
serde.version = "^1"
toml.version = "^0.9"
blake3.version = "^1"
base64.version = "^0.22"
regex.version = "^1"
#/
itertools.version = "^0.14"
walkdir.version = "^2"
#/
cfg-if.version = "^1"
thiserror.version = "^2"
proc-macro2.version = "^1"
quote.version = "^1"
syn.version = "^2"

[workspace.package]
version = "0.0.6-rc.1"
edition = "2021"
rust-version = "1.88"
authors = ["Svyatoslav Pushkarev <yiffyrusdev@yandex.ru>"]
repository = "https://github.com/yiffyrusdev/sabry"
license = "MIT"
publish = true

[package]
name = "sabry"
description = "Syntactically Awesome But RustY - crate that brings SCSS/SASS into rust"
keywords = ["web", "sass", "scss", "macro"]
repository.workspace = true
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
## Workspace
sabry_procmacro = { workspace = true, optional = true }
sabry_build = { workspace = true, optional = true }
sabry_intrnl = { workspace = true }

[dev-dependencies]
leptos = { version = "^0.8" }
insta = { version = "^1", features = ["glob"] }

[features]
default = ["procmacro"]
const-scoping = ["sabry_procmacro?/const-compile"]
procmacro = ["dep:sabry_procmacro"]
build = ["dep:sabry_build"]
net-files = ["sabry_build/net-files"]
nightly = ["sabry_procmacro?/nightly"]
internals = []

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
