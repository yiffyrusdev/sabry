[package]
name = "sabry"
description = "Syntactically Awesome But RustY - crate that brings SCSS/SASS into rust"
keywords = ["web", "sass", "scss", "macro"]
repository.workspace = true
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
## Workspace
sabry_procmacro.workspace = true
sabry_intrnl.workspace = true

[dev-dependencies]
leptos.version = "^0.8"
insta.workspace = true
insta.features = ["glob"]

[features]
nightly = ["sabry_procmacro/nightly", "sabry_intrnl/nightly"]
